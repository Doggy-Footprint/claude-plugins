name: pin-sources

# claude.ai "Sync automatically" syncs only on pushes to this repo's default branch.
# Re-pinning each plugin's sha here turns a push to a plugin repo into a push here.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".claude-plugin/marketplace.json", "scripts/**", "tests/**", ".github/workflows/pin-sources.yml"]

permissions:
  contents: write

concurrency:
  group: pin-sources
  cancel-in-progress: false

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: test
        run: python3 -m unittest discover tests
      - name: pin
        run: python3 scripts/pin_sources.py | tee "$RUNNER_TEMP/changes.txt"
      - name: commit
        run: |
          if git diff --quiet -- .claude-plugin/marketplace.json; then
            echo "no source changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          summary=$(sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/; /g' "$RUNNER_TEMP/changes.txt")
          git commit -q -m "pin: ${summary}" -- .claude-plugin/marketplace.json
          git push -q origin HEAD:main
